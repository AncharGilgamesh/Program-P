[project]
name = "magistr-project"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "bcrypt==4.3.0",
    "lxml==5.3.2",
    "openpyxl==3.1.5",
    "pandas==2.2.3",
    "passlib==1.7.4",
    "pyside6==6.9.0",
    "python-docx==1.1.2",
    "xlrd==2.0.1",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.4",
]

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [
  "View/workspace.py",
  "View/appearance.py",
  "View/res_rc.py",
]

[tool.ruff.lint]
select = ["F", "E4", "E7", "E9"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
